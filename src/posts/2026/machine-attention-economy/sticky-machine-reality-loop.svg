<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', 'Liberation Sans', Arial, sans-serif">
<defs>
  <radialGradient id="swash" cx="100%" cy="0%" r="60%">
    <stop offset="0%" stop-color="#e75b2a" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#e75b2a" stop-opacity="0"/>
  </radialGradient>
  <marker id="sarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#e75b2a"/>
  </marker>
  <marker id="sarrowb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c14a20"/>
  </marker>
  <filter id="ssoft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2a231c" flood-opacity="0.06"/>
  </filter>
</defs>
<rect x="3" y="3" width="1594" height="794" rx="20" fill="#faf7f0" stroke="#e4ddcf" stroke-width="2"/><rect x="3" y="3" width="1594" height="794" rx="20" fill="url(#swash)"/>
<text x="72" y="80" font-size="15" fill="#e75b2a" font-weight="700" text-anchor="start" letter-spacing="3.2">FIGURE 3  ·  ATTENTION CAPITAL</text>
<text x="72" y="122" font-family="Georgia, 'Liberation Serif', 'Times New Roman', serif" font-size="32" fill="#1b1611" font-weight="700" text-anchor="start">The compounding loop</text>
<rect x="72" y="140" width="54" height="3" rx="1.5" fill="#e75b2a"/>
<text x="72" y="178" font-size="18" fill="#6c6252" font-weight="400" text-anchor="start">Selection creates records.  Records make the next selection cheaper.  The advantage compounds.</text>

<!-- The initial boost: the temporary trigger (it can vanish) -->
<rect x="90" y="410" width="230" height="150" rx="15" fill="#fdf7ea" stroke="#8a5e12" stroke-width="2.5" filter="url(#ssoft)"/>
<text x="205" y="453" font-size="17" fill="#8a5e12" font-weight="700" text-anchor="middle" letter-spacing="0.6">THE INITIAL BOOST</text>
<rect x="168" y="465" width="74" height="2.5" rx="1" fill="#8a5e12" opacity="0.55"/>
<text x="205" y="500" font-family="Georgia, 'Liberation Serif', 'Times New Roman', serif" font-size="15.5" fill="#6c6252" font-weight="400" text-anchor="middle" style="font-style:italic">a default, a feature,</text>
<text x="205" y="522" font-family="Georgia, 'Liberation Serif', 'Times New Roman', serif" font-size="15.5" fill="#6c6252" font-weight="400" text-anchor="middle" style="font-style:italic">a first pick</text>
<path d="M324,483 L603,483" fill="none" stroke="#8a5e12" stroke-width="3.2" marker-end="url(#sarrow)"/>
<text x="464" y="470" font-size="12.5" fill="#8a5e12" font-weight="700" text-anchor="middle" letter-spacing="0.8">opens the loop</text>

<!-- The compounding cycle: admission -> action -> attention capital -> lower cost -> back -->
<rect x="610" y="438" width="200" height="84" rx="14" fill="#fefdf9" stroke="#e4ddcf" stroke-width="1.5" filter="url(#ssoft)"/>
<text x="710" y="470" font-size="16" fill="#1b1611" font-weight="700" text-anchor="middle" letter-spacing="0.8">ADMISSION</text>
<text x="710" y="492" font-size="12.5" fill="#6c6252" font-weight="400" text-anchor="middle">an option enters</text>
<text x="710" y="509" font-size="12.5" fill="#6c6252" font-weight="400" text-anchor="middle">the trusted set</text>

<rect x="950" y="228" width="200" height="84" rx="14" fill="#fefdf9" stroke="#e4ddcf" stroke-width="1.5" filter="url(#ssoft)"/>
<text x="1050" y="260" font-size="16" fill="#1b1611" font-weight="700" text-anchor="middle" letter-spacing="0.8">ACTION</text>
<text x="1050" y="282" font-size="12.5" fill="#6c6252" font-weight="400" text-anchor="middle">recommend, invoke,</text>
<text x="1050" y="299" font-size="12.5" fill="#6c6252" font-weight="400" text-anchor="middle">execute</text>

<rect x="1290" y="438" width="200" height="84" rx="14" fill="#fefcf6" stroke="#e75b2a" stroke-width="1.8" filter="url(#ssoft)"/>
<text x="1390" y="462" font-size="14.5" fill="#1b1611" font-weight="700" text-anchor="middle" letter-spacing="0.4">ATTENTION CAPITAL</text>
<text x="1390" y="484" font-size="12.5" fill="#6c6252" font-weight="400" text-anchor="middle">logs, reviews, revenue,</text>
<text x="1390" y="501" font-size="12.5" fill="#6c6252" font-weight="400" text-anchor="middle">the residue that stays</text>

<rect x="950" y="648" width="200" height="90" rx="14" fill="#fefdf9" stroke="#e4ddcf" stroke-width="1.5" filter="url(#ssoft)"/>
<text x="1050" y="681" font-size="16" fill="#1b1611" font-weight="700" text-anchor="middle" letter-spacing="0.6">LOWER COST</text>
<text x="1050" y="703" font-size="12.5" fill="#6c6252" font-weight="400" text-anchor="middle">cheaper to trust,</text>
<text x="1050" y="720" font-size="12.5" fill="#6c6252" font-weight="400" text-anchor="middle">likelier to be picked</text>

<!-- Cycle arrows, clockwise -->
<path d="M800,452 A 340 210 0 0 1 968,308" fill="none" stroke="#e75b2a" stroke-width="3" marker-end="url(#sarrow)"/>
<path d="M1132,308 A 340 210 0 0 1 1300,452" fill="none" stroke="#e75b2a" stroke-width="3" marker-end="url(#sarrow)"/>
<path d="M1300,518 A 340 210 0 0 1 1140,660" fill="none" stroke="#e75b2a" stroke-width="3" marker-end="url(#sarrow)"/>
<path d="M960,660 A 340 210 0 0 1 800,520" fill="none" stroke="#c14a20" stroke-width="4.2" marker-end="url(#sarrowb)"/>

<!-- Return leg: the compounding payoff -->
<rect x="694" y="574" width="300" height="50" rx="8" fill="#faf7f0"/>
<text x="844" y="595" font-size="15" fill="#c14a20" font-weight="700" text-anchor="middle" letter-spacing="0.3">FUTURE ADMISSION</text>
<text x="844" y="615" font-size="15" fill="#c14a20" font-weight="700" text-anchor="middle" letter-spacing="0.3">BECOMES EASIER</text>

<!-- Faint cycle hub -->
<path d="M1050,432 A 48 48 0 1 1 1002,480" fill="none" stroke="#b8a582" stroke-width="2.4" opacity="0.5" marker-end="url(#sarrow)"/>

<text x="72" y="770" font-family="Georgia, 'Liberation Serif', 'Times New Roman', serif" font-size="16.5" fill="#6c6252" font-weight="400" text-anchor="start" style="font-style:italic">The original boost can vanish while the advantage stays.</text>
</svg>
