<path d="M650,326 L650,357" fill="none" stroke="#8a5e12" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round" marker-end="url(#arrowg)"/>
<text x="72" y="1194" font-family="Georgia, 'Liberation Serif', 'Times New Roman', serif" font-size="17" fill="#6c6252" font-weight="400" text-anchor="start" style="font-style:italic">Repeated selection doesn&#x27;t make an option more true.  It makes the next selection cheaper.</text>
