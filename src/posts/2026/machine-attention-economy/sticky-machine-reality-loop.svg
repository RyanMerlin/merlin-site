<text x="1010.0" y="746.0" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="16" fill="#6c6252" font-weight="400" text-anchor="middle">The agent recommends, invokes,</text>
