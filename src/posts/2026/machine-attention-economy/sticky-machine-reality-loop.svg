<text x="650" y="286" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="15" fill="#8a5e12" font-weight="700" text-anchor="middle" letter-spacing="2">THE INITIAL BOOST</text>
