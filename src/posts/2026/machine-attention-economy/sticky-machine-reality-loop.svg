<rect x="3" y="3" width="1294" height="1244" rx="20" fill="#faf7f0" stroke="#e4ddcf" stroke-width="2"/><rect x="3" y="3" width="1294" height="1244" rx="20" fill="url(#wash)"/>
<text x="72" y="80" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', 'Liberation Sans', Arial, sans-serif" font-size="15" fill="#e75b2a" font-weight="700" text-anchor="start" letter-spacing="3.2">FIGURE 2  ·  ATTENTION CAPITAL</text>
